# Every pull request runs linting, type checks, the test suite, and a
# dependency vulnerability scan (report Section 27.2). The cross-tenant
# leakage suite added in Phase 4 becomes a release gate on this same workflow.

name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skilrize
          POSTGRES_USER: skilrize
          POSTGRES_PASSWORD: skilrize
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      POSTGRES_DB: skilrize
      POSTGRES_USER: skilrize
      POSTGRES_PASSWORD: skilrize
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      FILE_SIGNING_KEY: ci-file-signing-key
    defaults:
      run: {working-directory: api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
