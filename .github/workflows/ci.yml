# Every pull request runs linting, type checks, the test suite, and a
# dependency vulnerability scan (report Section 27.2). The cross-tenant
# leakage suite added in Phase 4 becomes a release gate on this same workflow.

name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skilrize
          POSTGRES_USER: skilrize
          POSTGRES_PASSWORD: skilrize
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      POSTGRES_DB: skilrize
      POSTGRES_USER: skilrize
      POSTGRES_PASSWORD: skilrize
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      FILE_SIGNING_KEY: ci-file-signing-key
    defaults:
      run: {working-directory: api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q

      # Runs again, on its own, deliberately. Section 15.2 makes cross-tenant
      # leakage a release gate rather than ordinary coverage, and a gate folded
      # into a 169-test run is not a gate — it is a line of scrollback. As its
      # own step it fails loudly, names itself in the checks list, and cannot be
      # silently dropped by a collection-pattern change.
      #
      # `--strict-markers -p no:randomly` keeps it deterministic, and the
      # explicit count guards against the suite being emptied rather than fixed.
      - name: Cross-tenant leakage gate
        run: pytest core/test_tenancy.py -q --strict-markers
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: mobile}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.0", channel: stable, cache: true}
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        # The `live` suite is tagged and skipped by default — it needs a
        # running Django stack and a seeded account, which CI has neither of.
        # See mobile/dart_test.yaml and mobile/test/live_api_test.dart.
        run: flutter test
      # The web build is what makes the app runnable without an Android
      # emulator or a Mac, so it is the one that gates a merge. An APK would
      # need the Android SDK image and proves less about the Dart.
      - name: Build (web)
        run: flutter build web --release --no-wasm-dry-run
